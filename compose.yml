services:
  web:
    build:
      context: .
      args:
        BOGEY_VERSION: ${BOGEY_VERSION:-v2.4.0}
    image: my-bogey
    env_file: .env
    volumes:
      - ./bogey.config.ts:/app/bogey.config.ts:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BOGEY_HOST: ${BOGEY_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
